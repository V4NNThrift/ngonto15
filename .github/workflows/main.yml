name: Yanzz Ubuntu VPS System (Final Perfect Execution)

on:
  workflow_dispatch:

jobs:
  ubuntu-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Set Timezone ke Indonesia (WIB)
        run: sudo timedatectl set-timezone Asia/Jakarta

      - name: Install System Dependencies (Linux Tools)
        run: |
          sudo apt update
          sudo apt install -y ffmpeg socat xvfb fluxbox scrot curl wget gawk jq
          
          # Install yt-dlp secara manual agar versi terbaru
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Setup Node.js & PM2
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: sudo npm install -g pm2

      - name: Setup Jaringan Tailscale (VPN)
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-ubuntu-${GITHUB_RUN_ID}
          
          TS_IP=$(tailscale ip -4)
          echo "$TS_IP" > /home/runner/ts_ip.txt

      - name: Install & Setup 9Router AI Gateway (ANTI-SUICIDE FIX)
        run: |
          # 1. Install 9Router
          sudo npm install -g 9router
          
          # 2. FIX: Tambahkan flag "--host 127.0.0.1" agar 9Router merasa aman dan tidak "Exiting..."
          export CI="true"
          pm2 start 9router --name "9Router-AI" -- --host 127.0.0.1
          
          # 3. Tunggu mesin Node.js stabil
          sleep 5
          
          # 4. Gunakan Socat untuk mem-bypass secara diam-diam dari Port 9000 ke 20128
          nohup socat TCP-LISTEN:9000,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:20128 > /dev/null 2>&1 &

      - name: Setup Virtual Monitor (Untuk Fitur Screenshot)
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 2
          DISPLAY=:99 fluxbox &

      - name: Merakit & Menjalankan Bot Telegram (Diagnostic Engine)
        run: |
          mkdir -p /home/runner/TelegramBot
          cd /home/runner/TelegramBot
          npm init -y
          npm install telegraf
          
          cat << 'EOF' > bot.js
          const { Telegraf, Markup } = require('telegraf');
          const { spawn, execSync, exec } = require('child_process');
          const os = require('os');
          const fs = require('fs');
          const util = require('util');
          const execAsync = util.promisify(exec);
          
          const bot = new Telegraf('PLACEHOLDER_TOKEN');
          const myChatId = 'PLACEHOLDER_CHATID';
          
          let streamKey = '0ahd-k6zv-xuez-ww2r-4mjf';
          const ytHandle = 'Yanzz'; 
          const tsIP = fs.existsSync('/home/runner/ts_ip.txt') ? fs.readFileSync('/home/runner/ts_ip.txt', 'utf8').trim() : 'Tidak diketahui';
          
          let ffmpegProcess = null;
          let botState = 'idle';
          
          bot.use((ctx, next) => {
              if (ctx.from && ctx.from.id.toString() === myChatId) return next();
          });
          
          const menuUtama = Markup.inlineKeyboard([
              [Markup.button.callback('📺 Menu Streaming', 'menu_stream'), Markup.button.callback('⚙️ Sistem & Info', 'menu_sistem')],
              [Markup.button.callback('📜 Cek Log 9Router', 'log_router'), Markup.button.callback('🔄 Restart Bot', 'restart_bot')]
          ]);
          
          bot.command('start', (ctx) => {
              botState = 'idle';
              ctx.reply(`👋 *Selamat datang di UBUNTU LINUX, Bos!*\n\n🔗 *Akses 9Router:* http://${tsIP}:9000\n🔑 *Default Pass:* \`123456\``, { parse_mode: 'Markdown', ...menuUtama });
          });
          
          bot.action('main_menu', (ctx) => {
              ctx.editMessageText('🤖 *Panel Kontrol Linux (Utama):*', { parse_mode: 'Markdown', ...menuUtama }).catch(()=>{});
              ctx.answerCbQuery();
          });
          
          bot.action('log_router', async (ctx) => {
              ctx.answerCbQuery('Mengambil log 9Router...');
              try {
                  const rLog = execSync('pm2 logs 9Router-AI --lines 25 --nostream').toString().substring(0, 3500);
                  await ctx.reply(`📜 *Live Log 9Router:*\n\`\`\`text\n${rLog}\n\`\`\``, { parse_mode: 'Markdown' });
              } catch (err) {
                  await ctx.reply(`❌ *Gagal baca log:* ${err.message}`);
              }
          });
          
          bot.action('restart_bot', async (ctx) => {
              ctx.answerCbQuery('Merestart sistem...');
              ctx.reply('🔄 Menginisiasi *restart* PM2...');
              setTimeout(() => { exec('pm2 restart TelegramRemoteVIP'); }, 1500);
          });
          
          bot.on('text', async (ctx) => {
              const txt = ctx.message.text;
              if (txt.startsWith('/')) return;
              try {
                  const msg = await ctx.reply(`⚙️ *Menjalankan (Bash):* \`${txt}\``, { parse_mode: 'Markdown' });
                  const { stdout, stderr } = await execAsync(txt, { timeout: 15000 });
                  let out = stdout || stderr || 'Berhasil tanpa output.';
                  if (out.length > 3500) out = out.substring(0, 3500) + '... (Terpotong)';
                  await ctx.telegram.editMessageText(ctx.chat.id, msg.message_id, null, `💻 *Hasil:*\n\`\`\`text\n${out}\n\`\`\``, { parse_mode: 'Markdown' }).catch(()=>{});
              } catch (err) {
                  ctx.reply(`❌ *Error:*\n\`\`\`text\n${err.message}\n\`\`\``, { parse_mode: 'Markdown' });
              }
          });
          
          process.on('uncaughtException', (err) => { console.error(err); });
          process.on('unhandledRejection', (reason) => { console.error(reason); });
          
          bot.telegram.sendMessage(myChatId, "⏳ *Mengumpulkan Data Server...*", { parse_mode: 'Markdown' }).then((msg) => {
              setTimeout(() => {
                  let rLog = 'Gagal membaca log.';
                  try { 
                      rLog = execSync('pm2 logs 9Router-AI --lines 15 --nostream').toString(); 
                      if(rLog.length > 800) rLog = rLog.substring(rLog.length - 800);
                  } catch(e){}
                  
                  const text = `🐧 *UBUNTU SYSTEM READY!* 🐧\n\n🌐 *Link Akses:* http://${tsIP}:9000\n\n⚠️ *LOG TERBARU 9ROUTER:*\n\`\`\`text\n${rLog}\n\`\`\`\n\n🤖 _Ketik /start untuk menu utama._`;
                  
                  bot.telegram.editMessageText(myChatId, msg.message_id, null, text, { parse_mode: 'Markdown' }).catch(() => {});
              }, 4000);
          });
          
          bot.launch();
          process.once('SIGINT', () => bot.stop('SIGINT'));
          process.once('SIGTERM', () => bot.stop('SIGTERM'));
          EOF
          
          sed -i "s/PLACEHOLDER_TOKEN/${{ secrets.TELEGRAM_TOKEN }}/g" bot.js
          sed -i "s/PLACEHOLDER_CHATID/${{ secrets.TELEGRAM_CHAT_ID }}/g" bot.js
          
          pm2 start bot.js --name "TelegramRemoteVIP"
          sleep 3
          pm2 logs TelegramRemoteVIP --lines 10 --nostream

      - name: Menahan Server Tetap Aktif
        run: |
          echo "Sistem Ubuntu Enterprise mengudara."
          tail -f /dev/null
