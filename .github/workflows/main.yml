name: Yanzz Ubuntu

on:
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Update System
        run: |
          sudo apt update
          sudo apt upgrade -y

      - name: Install Packages
        run: |
          sudo apt install -y \
            openssh-server \
            git \
            curl \
            wget \
            unzip \
            zip \
            python3 \
            python3-pip \
            nodejs \
            npm \
            rclone \
            qbittorrent

          sudo npm install -g pm2

      - name: Configure SSH
        run: |
          sudo systemctl enable ssh
          sudo systemctl start ssh

          echo "runner:Evan123456" | sudo chpasswd

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sudo sh

      - name: Connect Tailscale
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-ubuntu-${{ github.run_id }}

          IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$IP" >> $GITHUB_ENV

      - name: Show Connection Info
        run: |
          echo "======================"
          echo "SSH Host : $TAILSCALE_IP"
          echo "User     : runner"
          echo "Password : Evan123456"
          echo "======================"

      - name: Keep Alive
        run: |
          while true; do
            echo "Ubuntu Runner Active - $(date)"
            sleep 300
          done
